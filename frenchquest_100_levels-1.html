let currentLevel=1,index=0,score=0,xp=0,mistakes=[];
let unlocked=Number(localStorage.getItem("fqUnlocked")||1);
const $=id=>document.getElementById(id);
function renderLevels(){const c=$("levels");c.innerHTML="";for(let n=1;n<=100;n++){let b=document.createElement("button");b.className="level "+(n<=unlocked?"unlocked ":"")+(n===unlocked?"current":"");b.textContent=n;b.disabled=n>unlocked;b.onclick=()=>start(n);c.appendChild(b)}}
function start(level){currentLevel=level;index=0;score=0;mistakes=[];$("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");renderQuestion()}
function renderQuestion(){let qs=DATA.questions.filter(x=>x.level===currentLevel),q=qs[index];$("counter").textContent=`Level ${currentLevel} · Question ${index+1}/10`;$("bar").style.width=((index+1)*10)+"%";$("question").textContent=q.arabic;$("answers").innerHTML="";$("feedback").className="feedback";$("next").className="next";q.options.forEach(o=>{let b=document.createElement("button");b.className="answer";b.textContent=o;b.onclick=()=>answer(b,o,q);$("answers").appendChild(b)})}
function answer(btn,opt,q){document.querySelectorAll(".answer").forEach(b=>b.disabled=true);if(opt===q.correct){btn.classList.add("correct");score++;xp+=10;$("feedback").className="feedback show good";$("feedback").textContent="صحيح! +10 XP"}else{btn.classList.add("wrong");document.querySelectorAll(".answer").forEach(b=>{if(b.textContent===q.correct)b.classList.add("correct")});mistakes.push(q);$("feedback").className="feedback show bad";$("feedback").textContent=`خطأ. الصحيح: ${q.correct}`}$("xp").textContent=xp+" XP";$("next").className="next show"}
$("next").onclick=()=>{index++;if(index<10)renderQuestion();else finish()};
function finish(){if(currentLevel===unlocked&&unlocked<100){unlocked++;localStorage.setItem("fqUnlocked",unlocked)}$("game").classList.add("hidden");$("result").classList.remove("hidden");$("resultLevel").textContent=`Level ${currentLevel}`;$("score").textContent=`${score}/10`;$("xpGain").textContent=`+${score*10} XP`;$("mistakes").textContent=mistakes.length?`الأخطاء: ${mistakes.map(x=>x.arabic+" → "+x.correct).join(" · ")}`:"كاملين صحيح!"}
function goHome(){$("result").classList.add("hidden");$("home").classList.remove("hidden");renderLevels()}
renderLevels();
